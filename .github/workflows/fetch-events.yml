name: Fetch UM Events
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python fetch_events.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/events.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update events"
          git push
